name: Release

# Push a tag like v0.2.0 to build, test and publish APOMac-0.2.0.dmg as a GitHub release.
#
# Optional signing and notarization (removes the Gatekeeper warning) — add these
# repository secrets from an Apple Developer Program account:
#   DEVELOPER_ID_CERTIFICATE_P12   base64 of the exported "Developer ID Application" .p12
#   DEVELOPER_ID_CERTIFICATE_PASSWORD
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password for notarytool)
# Without them the app is ad-hoc signed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without "v"), e.g. 0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "No signing certificate configured; the app will be ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            xcrun notarytool store-credentials apomac-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "notary=apomac-notary" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app and DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UNIVERSAL: "1"
          MAKE_DMG: "1"
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_PROFILE: ${{ steps.signing.outputs.notary }}
        run: |
          ./scripts/package-app.sh
          cd .build/app-bundle
          shasum -a 256 "APOMac-$VERSION.dmg" > "APOMac-$VERSION.dmg.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "## Install"
            echo
            echo "1. Download **APOMac-$VERSION.dmg**, open it and drag **APOMac** to **Applications**."
            echo "2. Open APOMac and allow **System Audio Recording** when asked."
            if [[ -z "${{ steps.signing.outputs.identity }}" ]]; then
              echo
              echo "This build is not notarized. If macOS says it cannot verify APOMac, open **System Settings → Privacy & Security** and click **Open Anyway**, or run:"
              echo
              echo '```sh'
              echo 'xattr -dr com.apple.quarantine /Applications/APOMac.app'
              echo '```'
            fi
          } > "$notes"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "APOMac $VERSION" --notes-file "$notes" --generate-notes
          fi
          gh release upload "$tag" ".build/app-bundle/APOMac-$VERSION.dmg" ".build/app-bundle/APOMac-$VERSION.dmg.sha256" --clobber
